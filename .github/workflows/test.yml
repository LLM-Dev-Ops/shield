name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_DIRECTORY: packages/core

jobs:
  cache-contract:
    name: Live Cache Contract and Signed Replay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20.19.5
      - name: Prepare frozen baseline and locked tools
        run: |
          git worktree add --detach "$RUNNER_TEMP/shield-cache-baseline" 60bcd3c463228ee8c8ccadc4c7c560502d73e273
          npm ci --ignore-scripts --prefix packages/core/security/tools
          for root in "$RUNNER_TEMP/shield-cache-baseline/packages/core" "$GITHUB_WORKSPACE/packages/core"; do
            (cd "$root" && npm ci --ignore-scripts && npm run build:rollup && npm run build:types)
          done
      - name: Execute both revisions, frozen anchors, signed lineage and benchmark
        working-directory: packages/core
        run: |
          mkdir -p cache-evidence
          node security/evaluate-cache.mjs "$RUNNER_TEMP/shield-cache-baseline/packages/core" "$PWD" "$PWD/security/tools" cache-evidence/cache-flywheel.json
          node security/benchmark-cache.mjs "$RUNNER_TEMP/shield-cache-baseline/packages/core" "$PWD" cache-evidence/cache-benchmark.json
      - name: Retain project-only synthetic cache receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shield-cache-contract
          path: packages/core/cache-evidence/cache-*.json
          if-no-files-found: error
          retention-days: 30

  test:
    name: Core on ${{ matrix.os }} with Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: [20.19.5, 22.20.0]
        exclude:
          - os: macos-15
            node: 22.20.0
          - os: windows-2025
            node: 22.20.0
    defaults:
      run:
        working-directory: packages/core
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/core/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build independently tested wrapper
        run: npm run build:rollup && npm run build:types

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

  bundle-size:
    name: Check Bundle Size
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/core
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: packages/core/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build TypeScript bundle
        run: npm run build:rollup && npm run build:types
      - name: Check bundle size
        run: npm run size

  security:
    name: NPM Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/core
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: packages/core/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=moderate

  browser-tests:
    name: Browser Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/core
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.5
          cache: npm
          cache-dependency-path: packages/core/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build TypeScript bundle
        run: npm run build:rollup && npm run build:types
      - name: Run browser tests
        run: npm run test:browser
      - name: Upload browser test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: packages/core/playwright-report/
          retention-days: 30
