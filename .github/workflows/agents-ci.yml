name: Agents CI

on:
  pull_request:
    paths:
      - "agents/**"
      - ".github/workflows/agents-ci.yml"
  push:
    branches: [main]
    paths:
      - "agents/**"
      - ".github/workflows/agents-ci.yml"

permissions:
  contents: read

concurrency:
  group: agents-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: agents/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build deployable function graph
        run: npm run gcp-build
      - name: Test Cloud Function boundary
        run: npm test -w @llm-shield/functions
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
